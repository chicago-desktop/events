version: "1.0"
namespace: app

# Standalone harness for chicago/events. Provides the host resources the boot
# needs (app:db, app:processes, a gateway and a router for the shell's
# endpoints, env storage, a permissive actor scope) and runs the co-located
# *_test.lua suites. kickside/core is not booted — test/stubs/core stands in
# for it with only the library the window imports (test/.wippy.yaml).
# Excluded from publish by the module's wippy.yaml.
#
# Every test entry is a function.lua with `meta.type: test`; `wippy test`
# runs the ones it discovers. A test file must be in the run_cases form — the
# other form is counted, printed green and never executed.
#
# The suites live here and not in the module's src. The module's
# `exclude_meta` drops test entries from a module loaded as a dependency, and
# the harness loads it as one.

entries:
  - name: definition
    kind: ns.definition
    meta: {title: Event Viewer Test Harness}

  - name: model_test
    kind: function.lua
    meta:
      type: test
      comment: "Event Viewer model — log labels and the class tree, type split and message line, paging newest first, text and type filters, pretty payload, properties."
      group: Event Viewer
      suite: chicago_events
    source: file://model_test.lua
    imports:
      test: wippy.test:test
      model: chicago.events:model
    method: run

  - name: window_test
    kind: function.lua
    meta:
      type: test
      comment: "Event Viewer's window — the Start menu entry with the module's own picture, the window's policy, and the process's definition over the stand-in contract (the log tree, the first page, paging on end, the type filter, an event opened or raised in its own window, the event window itself, a refusal in the status bar)."
      group: Event Viewer
      suite: chicago_events
    source: file://window_test.lua
    method: run
    # Reading a picture takes `registry.get` as well as `fs.get`, and `gfx` to
    # decode it; the window reads the clock with `time`.
    modules: [gfx, fs, registry, time, json]
    imports:
      test: wippy.test:test
      app: chicago.shell.sdk:app
      images: chicago.shell.theme:images
      window: chicago.events:window
      event_window: chicago.events:event

  # ─── Host resources ───────────────────────────────────────────────────
  - name: db
    kind: db.sql.sqlite
    meta:
      comment: "In-memory database — Event Viewer does not use it, but the shell's migrations ask for the resource."
    file: ":memory:"

  - name: env_storage
    kind: env.storage.file
    meta:
      type: envstorage
    file_path: ./.wippy/test.env
    auto_create: true

  - name: processes
    kind: process.host
    lifecycle:
      auto_start: true

  # The shell's endpoint entries resolve against these at boot; no suite calls
  # them. The port is apart from the shell harness's :19229 and the other
  # modules' harnesses, so they can run side by side.
  - name: gateway
    kind: http.service
    addr: :19253
    lifecycle:
      auto_start: true

  - name: api
    kind: http.router
    meta:
      server: gateway
    prefix: /api

  - name: user
    kind: security.policy
    meta:
      comment: Permissive actor scope for the suites.
    policy:
      resources: '*'
      actions: '*'
      effect: allow

  # The harness tests the module, so it depends on it; the replacement in
  # .wippy.yaml substitutes the working copy from ../.
  - name: events_harness.dep.module
    version: "*"
    kind: ns.dependency
    meta:
      comment: The module under test; its source is replaced with ../ in .wippy.yaml.
    component: "chicago/events"

  - name: events_harness.dep.migration
    version: "*"
    kind: ns.dependency
    meta:
      comment: Host binding for the migrations the shell brings.
    component: "wippy/migration"
    parameters:
      - name: wippy.migration:app_db
        value: app:db

  - name: events_harness.dep.security
    version: "*"
    kind: ns.dependency
    meta:
      comment: Platform security groups that give host-managed services their policy scope under strict mode.
    component: "wippy/security"

  - name: events_harness.dep.bootloader
    version: "*"
    kind: ns.dependency
    meta:
      comment: Host wiring for the standalone test harness.
    component: "wippy/bootloader"
    parameters:
      - name: wippy.bootloader:application_host
        value: app:processes
      - name: wippy.bootloader:env_storage
        value: app:env_storage
